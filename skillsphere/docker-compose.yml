# Optional: a local PostgreSQL for development.  Usage:  docker compose up -d
# Reads POSTGRES_PASSWORD from your shell or a root-level .env file (never commit it).
services:
  postgres:
    image: postgres:16
    container_name: skillsphere-db
    environment:
      POSTGRES_DB: skillsphere_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - skillsphere_pgdata:/var/lib/postgresql/data
volumes:
  skillsphere_pgdata:
